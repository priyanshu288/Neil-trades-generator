name: daily-neil-scan

on:
  schedule:
    # Two slots ~12:10 and ~12:45 UTC (5:40 / 6:15 PM IST, 8:10 / 8:45 AM New York in EDT),
    # both before the 13:30 UTC US cash open. GitHub's cron is best-effort: runs at :00/:30
    # are often delayed or dropped under load, so off-peak minutes plus a second slot give
    # the daily Claude task (13:12 UTC) a much better chance of finding fresh data.
    # After the US switches to EST in November, shift both an hour later if you want the
    # same distance from the open.
    - cron: "11 12 * * *"
    - cron: "46 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r scanner/requirements.txt

      - name: Run scanner
        run: python scanner/scan.py -v 2>&1 | tail -n 200

      - name: Commit results
        run: |
          git config user.name "neil-scanner-bot"
          git config user.email "neil-scanner-bot@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "scan $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
